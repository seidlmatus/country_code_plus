name: country_codes_plus
description: Lightweight Flutter country and locale utilities with ISO 3166-1/2 codes, calling codes, localized names, device locale detection, and search.
version: 5.2.1
homepage: https://github.com/seidlmatus/country_code_plus
repository: https://github.com/seidlmatus/country_code_plus
issue_tracker: https://github.com/seidlmatus/country_code_plus/issues
topics:
  - country
  - country-codes
  - iso-3166
  - localization
  - dial-code

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.miguelruivo.flutter.plugin.countrycodes.country_codes_plus
        pluginClass: CountryCodesPlugin
      ios:
        pluginClass: CountryCodesPlugin
      macos:
        pluginClass: CountryCodesPlugin
      web:
        fileName: country_codes_plus_web.dart
        pluginClass: CountryCodesWebPlugin
